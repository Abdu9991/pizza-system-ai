name: Build and Deploy to GKE

on:
  push:
    branches:
      - main  # Trigger only when you push to the main branch

env:
  PROJECT_ID: your-google-project-id
  GKE_CLUSTER: your-cluster-name
  GKE_ZONE: us-central1-a
  IMAGE: pizza-ai-app

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # 1. Authenticate with Google Cloud
    - id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    # 2. Configure Docker to use gcloud as a credential helper
    - name: Configure Docker
      run: |-
        gcloud auth configure-docker

    # 3. Build the Docker image
    - name: Build
      run: |-
        docker build \
          --tag "gcr.io/$PROJECT_ID/$IMAGE:$GITHUB_SHA" \
          .

    # 4. Push the Docker image to Google Container Registry
    - name: Publish
      run: |-
        docker push "gcr.io/$PROJECT_ID/$IMAGE:$GITHUB_SHA"

    # 5. Deploy the Docker image to the GKE cluster
    - name: Deploy
      run: |-
        # Use sed to replace the image placeholder in your deployment.yaml
        sed -i "s|image:.*|image: gcr.io/$PROJECT_ID/$IMAGE:$GITHUB_SHA|g" deployment.yaml
        kubectl apply -f deployment.yaml
        kubectl rollout status deployment/pizza-app-deployment